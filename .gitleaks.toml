# Gitleaks config: default rules plus an allowlist for synthetic secret fixtures.
# Every path below holds fake, fictional credentials used to test the secret
# detectors; real credentials anywhere else still fail the scan. Sibling files
# in the same bench dirs (README, RESULTS, scorers, hash manifests) stay scanned.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic secret-detector fixtures (fictional values only)"
paths = [
  '''^docs/bench/secrets-heldout[0-9]+-[0-9]+/(secret-leaks|secret-decoys)\.txt$''',
  '''^docs/bench/secrets-heldout[0-9]+-[0-9]+/ledger\.jsonl$''',
  '''^docs/bench/g1-matrix/heldout/[^/]+/result\.json$''',
]

# The two secret-test scripts (scripts/test_secret_extra_rules_w5.py and
# scripts/test_secret_precision.py) are exempt only for their fictional fixture
# values, matched by value and not by path, so a real key added to either file is
# still caught. These value regexes apply repo-wide, not only to those two files:
# a line containing one of the values is exempt anywhere. (A path in an AND allowlist is applied on its own by gitleaks
# 8.30.1 and would blind the whole file again.)
[[allowlists]]
description = "Fictional fixture values in the secret test scripts"
regexTarget = "match"
regexes = [
  '''eyJhbGciOiJIUzI1NiJ9\.eyJyb2xlIjoiYW5vbiJ9\.''',
  '''sk_test_@@A2aMrXbJqxi4ai1aZSzJWHU7''',
  '''pk_live_n91DMA5Cj6vP3w01RyvJgcjy''',
]
