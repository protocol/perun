name: dcr-gates

# Installed by deep-code-review's `install.sh --with-gates`. Wires the
# INSTALLED skill's own gate scripts into THIS repo's CI, so the lessons the
# skill documents (a pinned test per fix commit, no committed binaries) run
# here as an enforced gate instead of staying prose an agent may or may not
# follow. Everything this workflow runs lives in `scripts/dcr-gates.sh`, which
# resolves paths inside the installed skill tree -- no gate logic is
# duplicated in this file. Re-run `install.sh --with-gates` after upgrading
# the skill; it will never silently overwrite a file you have since edited
# (see the installer's note on first run).
#
# MINIMUM-COST PROFILE (default below): doctrine lives in
# `agentic-delivery/references/host-enforcement.md`'s "Minimum-cost CI &
# token profile" -- not restated here. Hosted CI runs only on a PR into the
# default branch; a draft PR is skipped (its checks would burn minutes on
# work not yet ready for review); workflow-level `concurrency` cancels a
# superseded run instead of racing it to finish (safe -- one final push per
# PR before merge). If your default branch isn't `main`, edit `branches:`
# below. This shape assumes there is NO separate integration branch -- if
# there is one, that branch gets ZERO hosted CI (see the commented
# alternative and the doctrine link above); do not add a `push:` trigger or
# a second PR-into-development workflow to "also" cover it.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

# ---------------------------------------------------------------------------
# ALTERNATIVE (a repo with no separate integration branch, where every PR
# merges straight into main and a post-merge push re-run is acceptable):
# uncomment this block and delete the `on:` block above. `push` re-runs the
# same commits `pull_request` already ran ONLY when the default branch's
# required-status-checks are strict (branch must be up to date before
# merge); a non-strict repo can keep both without a duplicate-run cost.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
# ---------------------------------------------------------------------------

# Cancels a superseded run instead of letting it burn its full runner-minute
# budget after a newer push already replaced it (GitHub Actions concurrency:
# https://docs.github.com/en/actions/using-jobs/using-concurrency).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege

jobs:
  dcr-gates:
    # PERUN_GITHUB_ACTIONS=off (policy github_actions=off) skips this job. WARNING: a skipped required check counts as
    # passing, so with this job required, off bypasses the gate entirely; run the gates locally before every merge.
    if: github.event.pull_request.draft == false && vars.PERUN_GITHUB_ACTIONS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bound a hung run instead of paying for GitHub's own unset-job default ceiling
    steps:
      # SHA-pinned, not a mutable tag (same pin this skillset's own CI uses).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fix_class_gate diffs base..head; a depth-1 clone cannot resolve the range
          persist-credentials: false

      - name: Run installed deep-code-review gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/dcr-gates.sh
