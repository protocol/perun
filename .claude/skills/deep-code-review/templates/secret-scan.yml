name: secret-scan

# Opt-in, free secret scan: copy to `.github/workflows/secret-scan.yml`. Never installed by `install.sh`.
# No license key, no paid action, no secrets: it runs the open-source gitleaks binary,
# pinned by version and sha256 (bump both together; the digest is in the release's checksums file).
# A pull request scans only base..head; push, the weekly schedule and manual dispatch scan the full history.
# Handle a false positive by adding its fingerprint (printed by the scan) to `.gitleaksignore`;
# never by allowlisting a path, which hides every future secret under it.
# A PR scan resets .gitleaks.toml and .gitleaksignore to the base commit's copy first, so a PR cannot
# silence its own findings by editing the ignore config; push, schedule and dispatch use the committed config.
# Edit the push branch if your default branch is not `main`.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            for f in .gitleaks.toml .gitleaksignore; do git show "$BASE_SHA:$f" > "$f" 2>/dev/null || rm -f "$f"; done
            ./gitleaks git --redact --exit-code 1 -v --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            ./gitleaks git --redact --exit-code 1 -v
          fi
