# Bundled generic taint rules (Python). Sources: request data and entry-point parameters (route-decorated handlers, Django/DRF views, any parameter in a module importing a web framework; excluding self/cls).
# Sinks: classic injection calls. A guard `if X not in ALLOW: raise|return` before the sink suppresses it for X.
# Also hardcoded-credential-compare (a pass/secret/token/api-key name vs a non-empty string literal, WARNING) and hardcoded-basic-auth (a base64-decoded value vs a literal, ERROR); env reads, JWT header fields (alg, typ, kid), scheme/sentinel literals (bearer, none, true, ...), single-character literals and test/fixture paths are skipped. ponytail: template literals are not matched.
# Also secret-env-fallback (WARNING: os.environ.get("X", "..."), os.getenv("X", "..."), os.environ.setdefault("X", "..."), the same with default="...", and os.environ.get("X") or "..." or os.getenv("X") or "...", also when environ or getenv comes from `from os import`, where X ends in a secret stem (pass, passwd, password, passcode, passphrase, secret, token, credential, credentials, api_key, apikey, a secret, private, signing, encryption, session, jwt, hmac, master, access, auth, client, app, service, service_role or webhook key compound, or _pwd) after an optional prefix that ends in _ or . or sits at a camelCase boundary; the literal rule is the one hardcoded-credential-compare uses plus a second check that skips a literal that looks like a file path (it starts with /, ./, ../ or ~/, or ends in .json, .pem, .key, .crt, .cer, .der, .p12, .pfx, .jks, .keystore, .yaml or .yml), no default, None, "" and non-literal defaults are skipped, and test, fixture and mock paths are skipped). ponytail: a chained or (a or b or "x"), a conditional expression, an f-string with a {} field and os.environ bound to another name first are not matched, and the public-prefix check (public-env-secret) exists for JavaScript only. Not followed: a value first copied to a variable (s = os.environ.get("X"); s or "x") and a value-based fallback (a connection string holding a password under a non-secret name).
# Also git-argument-injection (WARNING: a request value as an element of the list literal passed to subprocess.run, call, check_call, check_output or Popen when the first element is the string git or a path ending /git and no -- or --end-of-options comes before it, so a leading dash makes it an option; an if value.startswith("-") with a return or raise before the call skips it).
rules:
- id: perun.py.sqli
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches a SQL string passed to execute(). Use bound parameters. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: &py-entry
        - patterns:
          - pattern-inside: |
              @$A.$M(...)
              def $F(..., $X, ...):
                ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
        - patterns:
          - pattern-inside: |
              @$A.$M(...)
              async def $F(..., $X, ...):
                ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
        - pattern-inside: |
            def $F(request, ..., $X, ...):
              ...
        - pattern-inside: |
            def $F(self, request, ..., $X, ...):
              ...
        - pattern-inside: |
            def $F(req, ..., $X, ...):
              ...
        - pattern-inside: |
            def $F(self, req, ..., $X, ...):
              ...
        - pattern-inside: |
            async def $F(request, ..., $X, ...):
              ...
        - pattern-inside: |
            async def $F(self, request, ..., $X, ...):
              ...
        - pattern-inside: |
            async def $F(req, ..., $X, ...):
              ...
        - pattern-inside: |
            async def $F(self, req, ..., $X, ...):
              ...
        - patterns:
          - pattern-inside: |
              def $F($X, context):
                ...
          - metavariable-regex:
              metavariable: $X
              regex: ^event$
        - patterns:
          - pattern-inside: |
              def $F($X, start_response):
                ...
          - metavariable-regex:
              metavariable: $X
              regex: ^environ$
        - patterns:
          - pattern-inside: |
              from $M import $A
              ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(flask|fastapi|django|rest_framework|starlette|aiohttp|tornado|sanic|bottle|pyramid|falcon|quart|litestar|werkzeug|chalice|cherrypy)(\..*)?$'
          - pattern-inside: |
              def $F(..., $X, ...):
                ...
        - patterns:
          - pattern-inside: |
              import $M
              ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(flask|fastapi|django|rest_framework|starlette|aiohttp|tornado|sanic|bottle|pyramid|falcon|quart|litestar|werkzeug|chalice|cherrypy)(\..*)?$'
          - pattern-inside: |
              def $F(..., $X, ...):
                ...
        - patterns:
          - pattern-inside: |
              from $M import $A
              ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(flask|fastapi|django|rest_framework|starlette|aiohttp|tornado|sanic|bottle|pyramid|falcon|quart|litestar|werkzeug|chalice|cherrypy)(\..*)?$'
          - pattern-inside: |
              async def $F(..., $X, ...):
                ...
        - patterns:
          - pattern-inside: |
              import $M
              ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(flask|fastapi|django|rest_framework|starlette|aiohttp|tornado|sanic|bottle|pyramid|falcon|quart|litestar|werkzeug|chalice|cherrypy)(\..*)?$'
          - pattern-inside: |
              async def $F(..., $X, ...):
                ...
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($S, ...)
      - pattern: $C.executemany($S, ...)
      - pattern: $C.executescript($S)
      - pattern: $C.raw($S, ...)
      - pattern: text($S)
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: int(...)
  - pattern: float(...)
- id: perun.py.command-injection
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches a shell command. Use an argv list without shell=True. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.system($S)
      - pattern: os.popen($S, ...)
      - pattern: subprocess.$M($S, ..., shell=True, ...)
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.system(<... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.popen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... subprocess.$M(<... $G ...>, ..., shell=True, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.system(<... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.popen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... subprocess.$M(<... $G ...>, ..., shell=True, ...) ...>
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: shlex.quote(...)
  - pattern: int(...)
- id: perun.py.git-argument-injection
  mode: taint
  languages: [python]
  severity: WARNING
  message: A request value is passed to git as an argument with no -- before it, so a value that starts with a dash is read as an option. Put -- before it or reject values that start with a dash.
  pattern-sources:
  - pattern-either:
    - pattern: request.$A.get(...)
    - pattern: request.$A.getlist(...)
    - pattern: request.$A[...]
    - pattern: flask.request.$A.get(...)
    - pattern: flask.request.$A.getlist(...)
    - pattern: flask.request.$A[...]
    - pattern: request.get_json(...)
    - pattern: flask.request.get_json(...)
  # ponytail: only an element of the list literal in the call counts, and one with constant text before the value (f"--opt={v}") is not reported; a list built elsewhere (a variable, a spread, an append) is not followed, and plain function parameters and input() are not sources. Only an if value.startswith("-") guard that returns or raises counts, alone or joined to other conditions with or.
  pattern-sinks:
  - patterns:
    - pattern: subprocess.$M([$B, ..., $E, ...], ...)
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:run|call|check_call|check_output|Popen)$
    - metavariable-regex:
        metavariable: $B
        regex: ^["'](?:git|[^"']*/git)["']$
    - metavariable-regex:
        metavariable: $E
        regex: ^(?![bBrRuU]{0,2}["']|[rR]?[fF][rR]?["'](?!\{[^{]))
    - pattern-not: subprocess.$M([$B, ..., "--", ..., $E, ...], ...)
    - pattern-not: subprocess.$M([$B, ..., "--end-of-options", ..., $E, ...], ...)
    - pattern-not-inside: |
        if $E.startswith("-"):
          ...
          return ...
        ...
    - pattern-not-inside: |
        if $E.startswith("-"):
          ...
          raise ...
        ...
    - pattern-not-inside: |
        if <... ($A or $E.startswith("-")) ...>:
          ...
          return ...
        ...
    - pattern-not-inside: |
        if <... ($A or $E.startswith("-")) ...>:
          ...
          raise ...
        ...
    - pattern-not-inside: |
        if <... ($E.startswith("-") or $A) ...>:
          ...
          return ...
        ...
    - pattern-not-inside: |
        if <... ($E.startswith("-") or $A) ...>:
          ...
          raise ...
        ...
    - focus-metavariable: $E
# send_from_directory is a sink on its base-directory argument only: it confines the file name (second argument) to that directory.
- id: perun.py.path-traversal
  mode: taint
  languages: [python]
  severity: WARNING
  message: Untrusted data reaches a filesystem path. Resolve and confine to a base directory, or use an allowlist. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: open($S, ...)
      - pattern: os.path.join($B, $S)
      - pattern: send_file($S, ...)
      - pattern: pathlib.Path($S, ...).open(...)
      - pattern: pathlib.Path($S, ...).read_text(...)
      - pattern: pathlib.Path($S, ...).read_bytes(...)
      - pattern: Path($S, ...).open(...)
      - pattern: Path($S, ...).read_text(...)
      - pattern: Path($S, ...).read_bytes(...)
      - pattern: pathlib.Path($S, ...).write_text(...)
      - pattern: pathlib.Path($S, ...).write_bytes(...)
      - pattern: pathlib.Path($S, ...).unlink(...)
      - pattern: Path($S, ...).write_text(...)
      - pattern: Path($S, ...).write_bytes(...)
      - pattern: Path($S, ...).unlink(...)
      - pattern: shutil.copy($S, ...)
      - pattern: shutil.copy($B, $S, ...)
      - pattern: shutil.copy2($S, ...)
      - pattern: shutil.copy2($B, $S, ...)
      - pattern: shutil.copyfile($S, ...)
      - pattern: shutil.copyfile($B, $S, ...)
      - pattern: shutil.copytree($S, ...)
      - pattern: shutil.copytree($B, $S, ...)
      - pattern: shutil.move($S, ...)
      - pattern: shutil.move($B, $S, ...)
      - pattern: shutil.rmtree($S, ...)
      - pattern: send_from_directory($S, ...)
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... open(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.path.join($B, <... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... send_file(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... open(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.path.join($B, <... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... send_file(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... send_from_directory(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... shutil.$M(..., <... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... Path(<... $G ...>, ...).$M(...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... pathlib.Path(<... $G ...>, ...).$M(...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... send_from_directory(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... shutil.$M(..., <... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... Path(<... $G ...>, ...).$M(...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... pathlib.Path(<... $G ...>, ...).$M(...) ...>
    - focus-metavariable: $S
  # ponytail: sanitizers match by name, no import anchoring; a project-local naive safe_join or secure_filename would silence a finding.
  pattern-sanitizers:
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - pattern: werkzeug.utils.secure_filename(...)
  - pattern: safe_join(...)
  - pattern: werkzeug.security.safe_join(...)
  - patterns:
    - pattern: $M[...]
    - metavariable-regex:
        metavariable: $M
        regex: ^[A-Z][A-Z0-9_]*$
- id: perun.py.ssrf
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data selects an outbound request URL. Allowlist scheme and host. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: requests.$M($S, ...)
      - pattern: httpx.$M($S, ...)
      - pattern: urllib.request.urlopen($S, ...)
      - pattern: urlopen($S, ...)
    # ponytail: no `in`-allowlist suppression. Semgrep cannot prove a container is a never-mutated all-literal constant or that the URL is not rebound, so such a guarded call still reports.
    - focus-metavariable: $S
  pattern-sanitizers:
  # A key lookup into an ALL_CAPS mapping returns one of its constants (the OWASP mapping allowlist). ponytail: an ALL_CAPS mapping filled from request data is not detected.
  - patterns:
    - pattern-either:
      - pattern: $D.get(...)
      - pattern: $D[...]
    - metavariable-regex:
        metavariable: $D
        regex: ^[A-Z][A-Z0-9_]*$
- id: perun.py.deserialize
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches an unsafe deserializer. Use json or yaml.safe_load. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors (request body and form accessors, including await request.post()/read()/body() and self.request.body/data). The bare name `request` is treated as a source even in a module with no web framework, so a non-web local named request can false-positive. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - &py_req_sources
    patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.stream
      - pattern: request.POST
      - pattern: request.form
      - pattern: request.files
      - pattern: await request.post()
      - pattern: self.request.body
      - pattern: self.request.data
      - pattern: request.get_data(...)
      - pattern: request.data
      - pattern: request.body
      - pattern: request.body()
      - pattern: request.read()
      # bare request.* is deliberate: `request` is the conventional name in every framework, no import needed
      - pattern: request.stream.read(...)
      - pattern: flask.request.get_data(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.json
      - pattern: flask.request.form
      - pattern: flask.request.files
      - pattern: flask.request.stream
      - pattern: flask.request.data
      - pattern: flask.request.stream.read(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: pickle.loads($S, ...)
      - pattern: pickle.load($S, ...)
      - pattern: _pickle.loads($S, ...)
      - pattern: _pickle.load($S, ...)
      - pattern: cPickle.loads($S, ...)
      - pattern: cPickle.load($S, ...)
      - pattern: marshal.loads($S)
      - pattern: marshal.load($S)
      - pattern: dill.loads($S, ...)
      - pattern: dill.load($S, ...)
      - pattern: pickle.Unpickler($S, ...)
      - patterns:
        - pattern: yaml.load($S, ...)
        - pattern-not: yaml.load($S, Loader=yaml.SafeLoader)
        - pattern-not: yaml.load($S, Loader=SafeLoader)
        - pattern-not: yaml.load($S, Loader=yaml.CSafeLoader)
        - pattern-not: yaml.load($S, Loader=CSafeLoader)
        - pattern-not: yaml.load($S, yaml.SafeLoader)
        - pattern-not: yaml.load($S, SafeLoader)
        - pattern-not: yaml.load($S, yaml.CSafeLoader)
        - pattern-not: yaml.load($S, CSafeLoader)
      - patterns:
        - pattern: yaml.load_all($S, ...)
        - pattern-not: yaml.load_all($S, Loader=yaml.SafeLoader)
        - pattern-not: yaml.load_all($S, Loader=SafeLoader)
        - pattern-not: yaml.load_all($S, Loader=yaml.CSafeLoader)
        - pattern-not: yaml.load_all($S, Loader=CSafeLoader)
        - pattern-not: yaml.load_all($S, yaml.SafeLoader)
        - pattern-not: yaml.load_all($S, SafeLoader)
        - pattern-not: yaml.load_all($S, yaml.CSafeLoader)
        - pattern-not: yaml.load_all($S, CSafeLoader)
      - pattern: yaml.unsafe_load_all($S, ...)
      - pattern: yaml.unsafe_load($S, ...)
      # FullLoader is not SafeLoader: untrusted YAML belongs in yaml.safe_load
      - pattern: yaml.full_load($S, ...)
      - pattern: yaml.full_load_all($S, ...)
      - pattern: jsonpickle.decode($S, ...)
    - focus-metavariable: $S
- id: perun.py.code-injection
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches eval or exec. Never build code from request data; parse it as data (json.loads, ast.literal_eval) or map it through an allowlist. Sources are the same as perun.py.deserialize.
  metadata:
    cwe: "CWE-94"
  pattern-sources:
  - *py_req_sources
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($S, ...)
      - pattern: exec($S, ...)
    - focus-metavariable: $S
- id: perun.py.ssti
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data is compiled as a template (CWE-1336, SSTI). Render a literal template and pass the data as context. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
      - pattern: flask.request.$A[...]
      - pattern: request.get_json(...)[...]
      - pattern: request.get_json(...).get(...)
      - pattern: flask.request.get_json(...)[...]
      - pattern: flask.request.get_json(...).get(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: jinja2.Template($S, ...)
      - pattern: Template($S, ...)
      - pattern: $E.from_string($S, ...)
      - pattern: render_template_string($S, ...)
      - pattern: flask.render_template_string($S, ...)
    - focus-metavariable: $S
- id: perun.py.xss
  mode: taint
  languages: [python]
  severity: WARNING
  message: Untrusted data is returned as markup without escaping. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-either: *py-entry
      - pattern: request.$A.get(...)
      - pattern: request.$A.getlist(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: flask.request.$A.getlist(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Markup($S)
      - pattern: HttpResponse($S, ...)
      - pattern: render_template_string($S, ...)
      - pattern: mark_safe($S)
