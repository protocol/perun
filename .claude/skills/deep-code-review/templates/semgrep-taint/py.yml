              with $A as $X:
                <... $X.$M(...) ...>
                ...
                return <... $R.$P ...>
            ...
      - pattern-inside: |
          class $C(...):
            ...
            async def $F(...):
              ...
              with $A as $X:
                <... $X.$M(...) ...>
                ...
                return <... $R.$P ...>
            ...
      - pattern-inside: |
          class $C(...):
            ...
