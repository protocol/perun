            <... $X.$M(...) ...>
            ...
            return <... $R.$P ...>
          ...
      - pattern-inside: |
          async def $F(...):
            <... $X.$M(...) ...>
            ...
            return <... $X.$M(...).$P ...>
          ...
    - metavariable-regex:
        metavariable: $X
        regex: '^(?:requests|httpx|(?:.*\.)?\w*(?i:client|session|sess|http)\w*)$'
    - metavariable-regex:
        metavariable: $P
        regex: '^(?:json|text|content)$'
  - patterns:
    - pattern: $F(...)
    - pattern-either:
      - pattern-inside: |
          def $F(...):
            ...
            with $A as $X:
              <... $X.$M(...) ...>
              ...
              return <... $R.$P ...>
          ...
      - pattern-inside: |
          async def $F(...):
            ...
            with $A as $X:
              <... $X.$M(...) ...>
              ...
              return <... $R.$P ...>
          ...
      - pattern-inside: |
          async def $F(...):
            ...
            async with $A as $X:
              <... $X.$M(...) ...>
              ...
              return <... $R.$P ...>
          ...
    - metavariable-regex:
        metavariable: $A
        regex: '(?s).*(?i:client|session)'
    - metavariable-regex:
        metavariable: $P
        regex: '^(?:json|text|content)$'
  - patterns:
    - pattern: self.$F(...)
    - pattern-either:
      - pattern-inside: |
          class $C(...):
            ...
            def $F(...):
              <... $X.$M(...) ...>
              ...
              return <... $R.$P ...>
            ...
      - pattern-inside: |
          class $C(...):
            ...
            def $F(...):
              <... $X.$M(...) ...>
              ...
              return <... $X.$M(...).$P ...>
            ...
      - pattern-inside: |
          class $C(...):
            ...
            async def $F(...):
              <... $X.$M(...) ...>
              ...
              return <... $R.$P ...>
            ...
      - pattern-inside: |
          class $C(...):
            ...
            async def $F(...):
              <... $X.$M(...) ...>
              ...
              return <... $X.$M(...).$P ...>
            ...
    - metavariable-regex:
        metavariable: $X
        regex: '^(?:requests|httpx|(?:.*\.)?\w*(?i:client|session|sess|http)\w*)$'
    - metavariable-regex:
        metavariable: $P
        regex: '^(?:json|text|content)$'
  - patterns:
    - pattern: self.$F(...)
    - pattern-either:
      - pattern-inside: |
          class $C(...):
            ...
            def $F(...):
