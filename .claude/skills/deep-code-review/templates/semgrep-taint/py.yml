# Bundled generic taint rules (Python). Sources: request data and function parameters (excluding self/cls).
# Sinks: classic injection calls. A guard `if X not in ALLOW: raise|return` before the sink suppresses it for X.
# Also hardcoded-credential-compare (a pass/secret/token/api-key name vs a non-empty string literal, WARNING) and hardcoded-basic-auth (a base64-decoded value vs a literal, ERROR); env reads, JWT header fields (alg, typ, kid), scheme/sentinel literals (bearer, none, true, ...), single-character literals and test/fixture paths are skipped. ponytail: template literals are not matched.
# Also secret-env-fallback (WARNING: os.environ.get("X", "..."), os.getenv("X", "..."), os.environ.setdefault("X", "..."), the same with default="...", and os.environ.get("X") or "..." or os.getenv("X") or "...", also when environ or getenv comes from `from os import`, where X ends in a secret stem (pass, passwd, password, passcode, passphrase, secret, token, credential, credentials, api_key, apikey, a secret, private, signing, encryption, session, jwt, hmac, master, access, auth, client, app, service, service_role or webhook key compound, or _pwd) after an optional prefix that ends in _ or . or sits at a camelCase boundary; the literal rule is the one hardcoded-credential-compare uses plus a second check that skips a literal that looks like a file path (it starts with /, ./, ../ or ~/, or ends in .json, .pem, .key, .crt, .cer, .der, .p12, .pfx, .jks, .keystore, .yaml or .yml), no default, None, "" and non-literal defaults are skipped, and test, fixture and mock paths are skipped). ponytail: a chained or (a or b or "x"), a conditional expression, an f-string with a {} field and os.environ bound to another name first are not matched, and the public-prefix check (public-env-secret) exists for JavaScript only. Not followed: a value first copied to a variable (s = os.environ.get("X"); s or "x") and a value-based fallback (a connection string holding a password under a non-secret name).
# Also git-argument-injection (WARNING: a request value as an element of the list literal passed to subprocess.run, call, check_call, check_output or Popen when the first element is the string git or a path ending /git and no -- or --end-of-options comes before it, so a leading dash makes it an option; an if value.startswith("-") with a return or raise before the call skips it).
rules:
- id: perun.py.sqli
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches a SQL string passed to execute(). Use bound parameters.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($S, ...)
      - pattern: $C.executemany($S, ...)
      - pattern: $C.executescript($S)
      - pattern: $C.raw($S, ...)
      - pattern: text($S)
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: int(...)
  - pattern: float(...)
- id: perun.py.command-injection
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches a shell command. Use an argv list without shell=True.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.system($S)
      - pattern: os.popen($S, ...)
      - pattern: subprocess.$M($S, ..., shell=True, ...)
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.system(<... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.popen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... subprocess.$M(<... $G ...>, ..., shell=True, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.system(<... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.popen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... subprocess.$M(<... $G ...>, ..., shell=True, ...) ...>
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: shlex.quote(...)
  - pattern: int(...)
- id: perun.py.git-argument-injection
  mode: taint
  languages: [python]
  severity: WARNING
  message: A request value is passed to git as an argument with no -- before it, so a value that starts with a dash is read as an option. Put -- before it or reject values that start with a dash.
  pattern-sources:
  - pattern-either:
    - pattern: request.$A.get(...)
    - pattern: request.$A[...]
    - pattern: flask.request.$A.get(...)
    - pattern: flask.request.$A[...]
    - pattern: request.get_json(...)
    - pattern: flask.request.get_json(...)
  # ponytail: only an element of the list literal in the call counts, and one with constant text before the value (f"--opt={v}") is not reported; a list built elsewhere (a variable, a spread, an append) is not followed, and plain function parameters and input() are not sources. Only an if value.startswith("-") guard that returns or raises counts, alone or joined to other conditions with or.
  pattern-sinks:
  - patterns:
    - pattern: subprocess.$M([$B, ..., $E, ...], ...)
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:run|call|check_call|check_output|Popen)$
    - metavariable-regex:
        metavariable: $B
        regex: ^["'](?:git|[^"']*/git)["']$
    - metavariable-regex:
        metavariable: $E
        regex: ^(?![bBrRuU]{0,2}["']|[rR]?[fF][rR]?["'](?!\{[^{]))
    - pattern-not: subprocess.$M([$B, ..., "--", ..., $E, ...], ...)
    - pattern-not: subprocess.$M([$B, ..., "--end-of-options", ..., $E, ...], ...)
    - pattern-not-inside: |
        if $E.startswith("-"):
          ...
          return ...
        ...
    - pattern-not-inside: |
        if $E.startswith("-"):
          ...
          raise ...
        ...
    - pattern-not-inside: |
        if <... ($A or $E.startswith("-")) ...>:
          ...
          return ...
        ...
    - pattern-not-inside: |
        if <... ($A or $E.startswith("-")) ...>:
          ...
          raise ...
        ...
    - pattern-not-inside: |
        if <... ($E.startswith("-") or $A) ...>:
          ...
          return ...
        ...
    - pattern-not-inside: |
        if <... ($E.startswith("-") or $A) ...>:
          ...
          raise ...
        ...
    - focus-metavariable: $E
- id: perun.py.path-traversal
  mode: taint
  languages: [python]
  severity: WARNING
  message: Untrusted data reaches a filesystem path. Resolve and confine to a base directory, or use an allowlist.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: open($S, ...)
      - pattern: os.path.join($B, $S)
      - pattern: send_file($S, ...)
      - pattern: send_from_directory($B, $S, ...)
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... open(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... os.path.join($B, <... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... send_file(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... send_from_directory($B, <... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... open(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... os.path.join($B, <... $G ...>) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... send_file(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... send_from_directory($B, <... $G ...>, ...) ...>
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - patterns:
    - pattern: $M[...]
    - metavariable-regex:
        metavariable: $M
        regex: ^[A-Z][A-Z0-9_]*$
- id: perun.py.ssrf
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data selects an outbound request URL. Allowlist scheme and host.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: requests.$M($S, ...)
      - pattern: httpx.$M($S, ...)
      - pattern: urllib.request.urlopen($S, ...)
      - pattern: urlopen($S, ...)
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... requests.$M(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... httpx.$M(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... urllib.request.urlopen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          raise ...
        ...
        <... urlopen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... requests.$M(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... httpx.$M(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... urllib.request.urlopen(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if $G not in $A:
          return ...
        ...
        <... urlopen(<... $G ...>, ...) ...>
    - focus-metavariable: $S
- id: perun.py.deserialize
  mode: taint
  languages: [python]
  severity: ERROR
  message: Untrusted data reaches an unsafe deserializer. Use json or yaml.safe_load.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: pickle.loads($S, ...)
      - pattern: pickle.load($S, ...)
      - pattern: marshal.loads($S)
      - pattern: yaml.load($S, ...)
      - pattern: yaml.unsafe_load($S, ...)
      - pattern: jsonpickle.decode($S, ...)
    - focus-metavariable: $S
- id: perun.py.xss
  mode: taint
  languages: [python]
  severity: WARNING
  message: Untrusted data is returned as markup without escaping.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Markup($S)
      - pattern: HttpResponse($S, ...)
      - pattern: render_template_string($S, ...)
      - pattern: mark_safe($S)
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: escape(...)
  - pattern: html.escape(...)
  - pattern: markupsafe.escape(...)
- id: perun.py.open-redirect
  mode: taint
  languages: [python]
  severity: WARNING
  message: Untrusted data selects a redirect target. Allowlist relative paths or known hosts.
  pattern-sources:
  - patterns:
    - pattern: $X
    - pattern-either:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern: request.$A.get(...)
      - pattern: request.$A[...]
      - pattern: flask.request.$A.get(...)
      - pattern: input(...)
    - metavariable-regex:
        metavariable: $X
        regex: ^(?!self$|cls$)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: redirect($S, ...)
      - pattern: HttpResponseRedirect($S, ...)
    - focus-metavariable: $S
- id: perun.py.hardcoded-credential-compare
  languages: [python]
  severity: WARNING
  message: A password, secret, token or API key is compared to a non-empty string literal. Compare against a secret read from the environment or a vault, with a constant-time check.
  patterns:
  - pattern-either:
    - pattern: $X == "$L"
    - pattern: $X != "$L"
    - pattern: '"$L" == $X'
    - pattern: '"$L" != $X'
    - pattern: $M.compare_digest($X, "$L")
    - pattern: $M.compare_digest("$L", $X)
    - pattern: compare_digest($X, "$L")
    - pattern: compare_digest("$L", $X)
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
  - metavariable-regex:
      metavariable: $X
      regex: ^(?:(?:.*[._])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|.*_(?i:pwd)|.*[a-z0-9](?:Pass|Passwd|Pwd|Password|Passcode|Secret|Token|ApiKey|APIKey)|.*(?:\[|\.get\()["'](?:(?:\w*[_-])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|\w+[_-](?i:pwd))["'][\])])(?:\.(?:toLowerCase|toUpperCase|trim|lower|upper|strip|casefold)\(\))*$
  - metavariable-regex:
      metavariable: $X
      regex: ^(?!.*\b(?:environ|getenv)\b)
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.hardcoded-basic-auth
  mode: taint
  languages: [python]
  severity: ERROR
  message: A decoded Basic-auth credential is compared to a string literal, so the password is hardcoded. Check it against a hashed secret from the environment or a vault, with a constant-time compare.
  pattern-sources:
  - pattern-either:
    - pattern: base64.b64decode(...)
    - pattern: base64.standard_b64decode(...)
    - pattern: base64.urlsafe_b64decode(...)
    - pattern: base64.decodebytes(...)
    - pattern: b64decode(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $T == "$L"
      - pattern: $T != "$L"
      - pattern: '"$L" == $T'
      - pattern: '"$L" != $T'
    - metavariable-regex:
        metavariable: $L
        regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
    - metavariable-regex:
        metavariable: $T
        regex: ^(?!.*[.\["'](?:alg|typ|kid)["']?\]?$)
    - focus-metavariable: $T
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.secret-env-fallback
  languages: [python]
  severity: WARNING
  message: A secret read from the environment falls back to a hardcoded string, so wherever the variable is unset (a new deploy, a preview, a staging box) the service silently runs with a known secret. Fail at startup when the variable is unset instead of falling back.
  patterns:
  - pattern-either:
    - pattern: os.environ.get("$N", "$L")
    - pattern: os.getenv("$N", "$L")
    - pattern: os.environ.get("$N", default="$L")
    - pattern: os.getenv("$N", default="$L")
    - pattern: os.environ.setdefault("$N", "$L")
    - pattern: os.environ.setdefault("$N", default="$L")
    - pattern: os.environ.get("$N") or "$L"
    - pattern: os.getenv("$N") or "$L"
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?:/|\./|\.\./|~/)|.*\.(?i:json|pem|key|crt|cer|der|p12|pfx|jks|keystore|yaml|yml)$)
  - metavariable-regex:
      metavariable: $N
      regex: ^(?:(?:.*(?:[._]|[a-z0-9](?=[A-Z])))?(?i:pass|passwd|password|passcode|passphrase|secret|token|credentials?|api_?key|(?:secret|private|signing|encryption|session|jwt|hmac|master|access|auth|client|app|service|service_role|webhook)_?key)|.*(?:_|[a-z0-9](?=[A-Z]))(?i:pwd))$
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
# OWASP API3:2023 inbound mass assignment: a whole request body (or a variable assigned from it) unpacked or passed into a model constructor, create or update; a setattr loop over request keys; DRF ModelSerializer/ModelForm with fields = "__all__". ponytail: search-mode, one block hop (`d = request.get_json(); ... User(**d)`); no cross-function flow. A schema or pydantic parse first (the argument is then a call or a new name) never matches.
- id: perun.py.mass-assignment
  languages: [python]
  severity: WARNING
  message: Whole request body written to a model (mass assignment). Pick named fields or validate against a schema with fixed fields.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either: &mass_sinks
        - patterns:
          - pattern: $M(**$B)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:.*\.)?[A-Z]\w*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(?!.*(?:In|Input|Schema|Payload|Request|Body|DTO|Params|Args|Form|Create|Update)$)
        - pattern: $M.objects.create(**$B)
        - pattern: $M.objects.update_or_create(**$B)
        - pattern: $M.objects.get_or_create(defaults=$B, ...)
        - pattern: $M.create(**$B)
        - pattern: $Q.update(**$B)
        - pattern: $Q.filter_by(...).update($B)
        - pattern: $Q.filter(...).update($B)
        - pattern: $O.__dict__.update($B)
      - metavariable-regex:
          metavariable: $B
          regex: &mass_re '^(?:request\.(?:json|data|POST|form)|(?:await\s+)?request\.json\(\)|request\.get_json\([^()]*\)|request\.POST\.dict\(\)|request\.form\.to_dict\(\))$'
    - patterns:
      - pattern-either: *mass_sinks
      - pattern-inside: |
          $B = $SRC
          ...
      - metavariable-regex:
          metavariable: $SRC
          regex: *mass_re
    - patterns:
      - pattern: |
          for $K, $V in $SRC.items():
            ...
            setattr($O, $K, $V)
      - pattern-not: |
          for $K, $V in $SRC.items():
            ...
            if $K in $A:
              ...
      - metavariable-regex:
          metavariable: $SRC
          regex: *mass_re
    - patterns:
      - pattern: fields = "__all__"
      - pattern-inside: |
          class $C($BASE):
            ...
            class Meta:
              ...
      - metavariable-regex:
          metavariable: $BASE
          regex: ^(?:.*\.)?(?:ModelSerializer|HyperlinkedModelSerializer|ModelForm)$
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
# OWASP API10:2023 unsafe consumption of APIs: a field of a requests/httpx response body (.json(), .text, .content, also from a response variable or a client/session named like *client or *session) reaches a SQL string passed to execute/executemany/executescript/raw/text/read_sql, a file path (open, Path, send_file), an outbound request URL (requests/httpx or a client verb), or a shell command (subprocess, os.system, os.popen) with no validation on the way. A same-file helper function or method that returns such a body is followed at its call sites, and a same-file wrapper whose parameter goes straight to a shell, SQL or file call is a sink at its call sites. int/float/bool, basename, secure_filename, shlex.quote, quote, UUID, hashlib, an as_/validate_/sanitize_/ensure_/assert_/coerce_/clean_/escape_ prefixed function, a lookup in an ALL_CAPS constant map, an in/not-in allowlist test, a regex match or isdigit/isalnum test, and a urlparse/urlsplit of the value (parsing is read as validating) clear the value. A request URL that starts with a literal scheme and host is skipped, a SQL string built with % from a parameter of the enclosing def is left to perun.py.sqli (no duplicate report), a subprocess list is a sink only as `sh -c <value>`. os.path.join is not a sink on its own: the open/Path call that uses its result is. A same-file def with an `if <path, prefix or type check>: raise` guard clears its result, but a def that only raises on a status check does not. ponytail: OSS semgrep taint is single-file, so a helper defined in another file is not followed, a helper must be defined before its caller in the same block (or class), and the response must come from requests/httpx or a client/session-named object.
- id: perun.py.unsafe-api-consumption
  mode: taint
  languages: [python]
  severity: WARNING
  message: A field of a third-party or internal API response reaches a SQL string, file path, outbound URL or shell command unvalidated. Validate the type, shape and allowed values of response data first, and bind SQL parameters. Known limit, only flows inside one file are followed, so a response read in one file and used in another is not reported.
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $MOD.$M(...).json()
      - pattern: $MOD.$M(...).text
      - pattern: $MOD.$M(...).content
    - metavariable-regex:
        metavariable: $MOD
        regex: ^(?:requests|httpx)$
  - patterns:
    - pattern-either:
      - pattern: $C.$M(...).json()
      - pattern: $C.$M(...).text
      - pattern: $C.$M(...).content
    - metavariable-regex:
        metavariable: $C
        regex: ^(?:.*\.)?\w*(?i:client|session|sess|http)\w*$
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:get|post|put|patch|delete|head|request)$
  - patterns:
    - pattern-either:
      - pattern: $R.json()
      - pattern: $R.text
      - pattern: $R.content
    - pattern-inside: |
        $R = $MOD.$M(...)
        ...
    - metavariable-regex:
        metavariable: $MOD
        regex: ^(?:requests|httpx)$
  - patterns:
    - pattern-either:
      - pattern: $R.json()
      - pattern: $R.text
      - pattern: $R.content
    - pattern-either:
