    - pattern: bool(...)
    - pattern: uuid.UUID(...)
    - pattern: UUID(...)
    - pattern: os.path.basename(...)
    - pattern: secure_filename(...)
    - pattern: shlex.quote(...)
    - pattern: urllib.parse.quote(...)
    - pattern: quote(...)
    - pattern: quote_plus(...)
    - pattern: hashlib.$H(...)
    - patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(?:as|validate|validated|sanitize|ensure|assert|coerce|clean|escape)_\w+$
