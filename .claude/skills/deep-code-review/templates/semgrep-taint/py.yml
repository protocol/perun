      - pattern: $T == "$L"
      - pattern: $T != "$L"
      - pattern: '"$L" == $T'
      - pattern: '"$L" != $T'
    - metavariable-regex:
        metavariable: $L
        regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
