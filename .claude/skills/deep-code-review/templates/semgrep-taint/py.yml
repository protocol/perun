    - metavariable-regex:
        metavariable: $P
        regex: '^(?:json|text|content)$'
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($S, ...)
      - pattern: $C.executemany($S, ...)
      - pattern: $C.executescript($S)
      - pattern: $C.raw($S, ...)
      - pattern: text($S)
      - pattern: pd.read_sql($S, ...)
      - pattern: open($S, ...)
      - pattern: Path($S, ...)
