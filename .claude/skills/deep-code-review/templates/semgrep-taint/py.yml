  message: Untrusted data selects a redirect target. Allowlist relative paths or known hosts. Sources are route-decorated handler and Django/DRF view parameters, any parameter in a module that imports a web framework, and request accessors. A helper in a module with no framework import that a handler calls from another file is not tracked, so audit helper-called sinks by hand.
