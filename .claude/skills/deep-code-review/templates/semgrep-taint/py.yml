# OWASP API10:2023 TLS verification turned off on an outbound HTTP client: verify=False on a requests/httpx call or a call on an object named like *client, *session or *pool, cert_reqs set to CERT_NONE, session.verify = False, ssl._create_unverified_context, check_hostname = False, verify_mode = ssl.CERT_NONE. A multi-line call is reported at the line of the unsafe argument. ponytail: search-mode, so a False held in a variable (verify=flag) is not matched.
- id: perun.py.tls-verify-off
  languages: [python]
  severity: WARNING
  message: TLS certificate verification is turned off, so any on-path attacker can impersonate the API. Trust a CA bundle (verify="/path/ca.pem") instead.
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $F(..., verify=$V, ...)
      - pattern: $F(..., cert_reqs=$V, ...)
    - metavariable-regex:
        metavariable: $V
        regex: ^(?:False|["']CERT_NONE["']|ssl\.CERT_NONE)$
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:.*\.)?(?:requests|httpx|urllib3|\w*(?i:client|session|sess|http|pool)\w*)(?:\.\w+)?$
    - focus-metavariable: $V
  - pattern: requests.Session().verify = False
  - pattern: $S.verify = False
  - pattern: ssl._create_unverified_context(...)
  - pattern: ssl._create_default_https_context = ssl._create_unverified_context
  - pattern: $C.check_hostname = False
  - pattern: $C.verify_mode = ssl.CERT_NONE
  - patterns:
    - pattern-either:
      - pattern: aiohttp.TCPConnector(..., ssl=$V, ...)
      - pattern: $S.$M(..., ssl=$V, ...)
    - metavariable-regex:
        metavariable: $V
        regex: ^False$
    - focus-metavariable: $V
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
