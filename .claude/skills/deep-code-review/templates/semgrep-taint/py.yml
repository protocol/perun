  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
# OWASP API10:2023 TLS verification turned off on an outbound HTTP client: verify=False on a requests/httpx call or a call on an object named like *client, *session or *pool, cert_reqs set to CERT_NONE, session.verify = False, ssl._create_unverified_context, check_hostname = False, verify_mode = ssl.CERT_NONE. A multi-line call is reported at the line of the unsafe argument. ponytail: search-mode, so a False held in a variable (verify=flag) is not matched.
- id: perun.py.tls-verify-off
  languages: [python]
  severity: WARNING
  message: TLS certificate verification is turned off, so any on-path attacker can impersonate the API. Trust a CA bundle (verify="/path/ca.pem") instead.
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $F(..., verify=$V, ...)
      - pattern: $F(..., cert_reqs=$V, ...)
    - metavariable-regex:
        metavariable: $V
        regex: ^(?:False|["']CERT_NONE["']|ssl\.CERT_NONE)$
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:.*\.)?(?:requests|httpx|urllib3|\w*(?i:client|session|sess|http|pool)\w*)(?:\.\w+)?$
    - focus-metavariable: $V
  - pattern: requests.Session().verify = False
  - pattern: $S.verify = False
  - pattern: ssl._create_unverified_context(...)
  - pattern: ssl._create_default_https_context = ssl._create_unverified_context
  - pattern: $C.check_hostname = False
  - pattern: $C.verify_mode = ssl.CERT_NONE
  - patterns:
    - pattern-either:
      - pattern: aiohttp.TCPConnector(..., ssl=$V, ...)
      - pattern: $S.$M(..., ssl=$V, ...)
    - metavariable-regex:
        metavariable: $V
        regex: ^False$
    - focus-metavariable: $V
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.raw-sql-format
  languages: [python]
  severity: ERROR
  message: A SQL string built with an f-string, % formatting, .format() or concatenation is passed to execute(), directly or through a variable assigned earlier in the same function (CWE-89). Pass the values as the second argument (cursor.execute("... WHERE id = %s", (x,))). ponytail, search mode - any interpolated value is reported, user-controlled or not, except UPPER_SNAKE constants in an f-string ({TABLE}; the skip is name-based, so a tainted value held in an UPPER_SNAKE name is left to perun.py.sqli); an f-string value that passed an unconditionally exiting `x not in ALLOWED` check (an `assert x in ALLOWED` still reports, since python -O strips asserts), that is wrapped by `if x in ALLOWED`, or that came from a same-file helper whose only statement is return MAP.get(x, "literal") / MAP[x], is skipped as allow-listed (the list or map must be an UPPER_SNAKE name, so a lowercase or request-derived list still reports; the check must be on the same variable; a reassignment of that variable after the check or helper call reports again); migration files (migrations/<digit>* and alembic/versions/) are skipped, other files under a migrations/ directory are still checked. Remaining limits - the variable form follows one assignment or += in the same function, not a value built in a helper or across files, and % / .format() / concatenation operands are not checked for constants.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: $C.execute(f"...{$X}...", ...)
        - pattern: $C.executemany(f"...{$X}...", ...)
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!\s*[A-Z][A-Z0-9_]*\s*$)
      # allow-listed value: see the message. Each guard needs an UPPER_SNAKE list/map and no reassignment of $X after the check or helper call.
      # exit guard: the block is a bare raise/return or one statement then raise/return (a leading ... would also match a conditional exit nested deeper, so it is not used)
      - &allow_exit
        pattern-not-inside:
          patterns:
          - pattern-either:
            - pattern: |
                if $X not in $S:
                    $EX
                ...
            - pattern: |
                if $X not in $S:
                    $A
                    $EX
                ...
          - pattern-not: |
              if $X not in $S:
                  $EX
              ...
              $X = $V
              ...
          - pattern-not: |
              if $X not in $S:
                  $EX
              ...
              $X += $V
              ...
          - pattern-not: |
              if $X not in $S:
                  $A
                  $EX
              ...
              $X = $V
              ...
          - pattern-not: |
              if $X not in $S:
                  $A
                  $EX
              ...
              $X += $V
              ...
          - metavariable-regex: {metavariable: $EX, regex: '^(?:raise|return)\b'}
          - metavariable-regex: {metavariable: $S, regex: '^[A-Z][A-Z0-9_]*$'}
      - &allow_wrapped
        pattern-not-inside:
          patterns:
          - pattern: |
              if $X in $S:
                  ...
          - pattern-not: |
              if $X in $S:
                  ...
              else:
                  ...
          - pattern-not: |
              if $X in $S:
                  ...
                  $X = $V
                  ...
          - pattern-not: |
              if $X in $S:
                  ...
                  $X += $V
                  ...
          - metavariable-regex: {metavariable: $S, regex: '^[A-Z][A-Z0-9_]*$'}
      - &allow_helper_get
        pattern-not-inside:
          patterns:
          - pattern: |
              def $F(...):
                  return $M.get(..., "...")
              ...
              $X = $F(...)
              ...
          - pattern-not: |
              def $F(...):
                  return $M.get(..., "...")
              ...
              $X = $F(...)
              ...
              $X = $V
              ...
          - pattern-not: |
              def $F(...):
                  return $M.get(..., "...")
              ...
              $X = $F(...)
              ...
              $X += $V
              ...
          - metavariable-regex: {metavariable: $M, regex: '^[A-Z][A-Z0-9_]*$'}
      - &allow_helper_index
        pattern-not-inside:
          patterns:
          - pattern: |
              def $F(...):
                  return $M[...]
              ...
              $X = $F(...)
              ...
          - pattern-not: |
              def $F(...):
                  return $M[...]
              ...
              $X = $F(...)
              ...
              $X = $V
              ...
          - pattern-not: |
              def $F(...):
                  return $M[...]
              ...
              $X = $F(...)
              ...
              $X += $V
              ...
          - metavariable-regex: {metavariable: $M, regex: '^[A-Z][A-Z0-9_]*$'}
    - pattern: $C.execute("..." % $X, ...)
    - pattern: $C.execute("...".format(...), ...)
    - pattern: $C.execute("..." + $X, ...)
    - pattern: $C.execute($X + "...", ...)
    - patterns:
      - pattern-either:
        - pattern: $C.execute($V, ...)
        - pattern: $C.executemany($V, ...)
      - pattern-either:
        - pattern-inside: |
            $V = f"...{$X}..."
            ...
        - pattern-inside: |
            $V += f"...{$X}..."
            ...
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!\s*[A-Z][A-Z0-9_]*\s*$)
      - *allow_exit
      - *allow_wrapped
      - *allow_helper_get
      - *allow_helper_index
    - patterns:
      - pattern-either:
        - pattern: $C.execute($V, ...)
        - pattern: $C.executemany($V, ...)
      - pattern-either:
        - pattern-inside: |
            $V = "..." % $X
            ...
        - pattern-inside: |
            $V = "...".format(...)
            ...
        - pattern-inside: |
            $V = "..." + $X
            ...
        - pattern-inside: |
            $V += $X
            ...
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "migrations/[0-9]*.py", "alembic/versions", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.guard-allows-missing-token
  languages: [python]
  severity: ERROR
  message: An auth guard returns True when no token or credential is present, so an unauthenticated request passes (CWE-306, CWE-636). Deny when the credential is missing.
  patterns:
  - pattern-either:
    - pattern: |
        if not $T:
            return True
    - pattern: |
        if not $T and $R:
            return True
    - pattern: |
        if not $T:
            ...
            return True
  - metavariable-regex:
      metavariable: $T
      regex: (?i)^.*(token|authorization|bearer|jwt|api_?key|credential|session).*$
  - pattern-inside: |
      def $F(...):
          ...
  - metavariable-regex:
      metavariable: $F
      regex: (?i)^.*(guard|auth|verify|protect|permission|allowed).*$
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
