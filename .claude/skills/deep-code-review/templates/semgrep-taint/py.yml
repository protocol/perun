- id: perun.py.secret-env-fallback
  languages: [python]
  severity: WARNING
  message: A secret read from the environment falls back to a hardcoded string, so wherever the variable is unset (a new deploy, a preview, a staging box) the service silently runs with a known secret. Fail at startup when the variable is unset instead of falling back.
  patterns:
  - pattern-either:
    - pattern: os.environ.get("$N", "$L")
    - pattern: os.getenv("$N", "$L")
    - pattern: os.environ.get("$N", default="$L")
    - pattern: os.getenv("$N", default="$L")
    - pattern: os.environ.setdefault("$N", "$L")
    - pattern: os.environ.setdefault("$N", default="$L")
    - pattern: os.environ.get("$N") or "$L"
    - pattern: os.getenv("$N") or "$L"
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?:/|\./|\.\./|~/)|.*\.(?i:json|pem|key|crt|cer|der|p12|pfx|jks|keystore|yaml|yml)$)
  - metavariable-regex:
      metavariable: $N
      regex: ^(?:(?:.*(?:[._]|[a-z0-9](?=[A-Z])))?(?i:pass|passwd|password|passcode|passphrase|secret|token|credentials?|api_?key|(?:secret|private|signing|encryption|session|jwt|hmac|master|access|auth|client|app|service|service_role|webhook)_?key)|.*(?:_|[a-z0-9](?=[A-Z]))(?i:pwd))$
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
# OWASP API3:2023 inbound mass assignment: a whole request body (or a variable assigned from it) unpacked or passed into a model constructor, create or update; a setattr loop over request keys; DRF ModelSerializer/ModelForm with fields = "__all__". ponytail: search-mode, one block hop (`d = request.get_json(); ... User(**d)`); no cross-function flow. A schema or pydantic parse first (the argument is then a call or a new name) never matches.
- id: perun.py.mass-assignment
  languages: [python]
  severity: WARNING
  message: Whole request body written to a model (mass assignment). Pick named fields or validate against a schema with fixed fields.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either: &mass_sinks
        - patterns:
          - pattern: $M(**$B)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:.*\.)?[A-Z]\w*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(?!.*(?:In|Input|Schema|Payload|Request|Body|DTO|Params|Args|Form|Create|Update)$)
        - pattern: $M.objects.create(**$B)
        - pattern: $M.objects.update_or_create(**$B)
        - pattern: $M.objects.get_or_create(defaults=$B, ...)
        - pattern: $M.create(**$B)
        - pattern: $Q.update(**$B)
        - pattern: $Q.filter_by(...).update($B)
        - pattern: $Q.filter(...).update($B)
        - pattern: $O.__dict__.update($B)
      - metavariable-regex:
          metavariable: $B
          regex: &mass_re '^(?:request\.(?:json|data|POST|form)|(?:await\s+)?request\.json\(\)|request\.get_json\([^()]*\)|request\.POST\.dict\(\)|request\.form\.to_dict\(\))$'
    - patterns:
      - pattern-either: *mass_sinks
      - pattern-inside: |
          $B = $SRC
          ...
      - metavariable-regex:
          metavariable: $SRC
          regex: *mass_re
    - patterns:
      - pattern: |
          for $K, $V in $SRC.items():
            ...
            setattr($O, $K, $V)
      - pattern-not: |
          for $K, $V in $SRC.items():
            ...
            if $K in $A:
              ...
      - metavariable-regex:
          metavariable: $SRC
          regex: *mass_re
    - patterns:
      - pattern: fields = "__all__"
      - pattern-inside: |
          class $C($BASE):
            ...
            class Meta:
              ...
      - metavariable-regex:
          metavariable: $BASE
          regex: ^(?:.*\.)?(?:ModelSerializer|HyperlinkedModelSerializer|ModelForm)$
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
# OWASP API10:2023 unsafe consumption of APIs: a field of a requests/httpx response body (.json(), .text, .content, also from a response variable or a client/session named like *client or *session) reaches a SQL string passed to execute/executemany/executescript/raw/text/read_sql, a file path (open, Path, send_file), an outbound request URL (requests/httpx or a client verb), or a shell command (subprocess, os.system, os.popen) with no validation on the way. A same-file helper function or method that returns such a body is followed at its call sites, and a same-file wrapper whose parameter goes straight to a shell, SQL or file call is a sink at its call sites. int/float/bool, basename, secure_filename, shlex.quote, quote, UUID, hashlib, an as_/validate_/sanitize_/ensure_/assert_/coerce_/clean_/escape_ prefixed function, a lookup in an ALL_CAPS constant map, an in/not-in allowlist test, a regex match or isdigit/isalnum test, and a urlparse/urlsplit of the value (parsing is read as validating) clear the value. A request URL that starts with a literal scheme and host is skipped, a SQL string built with % from a parameter of the enclosing def is left to perun.py.sqli (no duplicate report), a subprocess list is a sink only as `sh -c <value>`. os.path.join is not a sink on its own: the open/Path call that uses its result is. A same-file def whose raising `if` tests its parameter, or a local derived from it, with commonpath, is_relative_to, fullmatch, match, isalnum, isdigit or isalpha clears its result; a type-only, startswith, status-code or unrelated guard does not. ponytail: OSS semgrep taint is single-file, so a helper defined in another file is not followed, a helper must be defined before its caller in the same block (or class), and the response must come from requests/httpx or a client/session-named object.
- id: perun.py.unsafe-api-consumption
  mode: taint
  languages: [python]
  severity: WARNING
  message: A field of a third-party or internal API response reaches a SQL string, file path, outbound URL or shell command unvalidated. Validate the type, shape and allowed values of response data first, and bind SQL parameters. A SQL string built with an f-string, %, .format() or concatenation at execute() is left to perun.py.raw-sql-format (CWE-89), so it goes unreported here wherever that rule skips it (allow-listed values, migration files). Known limit, only flows inside one file are followed, so a response read in one file and used in another is not reported.
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $MOD.$M(...).json()
      - pattern: $MOD.$M(...).text
      - pattern: $MOD.$M(...).content
    - metavariable-regex:
        metavariable: $MOD
        regex: ^(?:requests|httpx)$
  - patterns:
    - pattern-either:
      - pattern: $C.$M(...).json()
      - pattern: $C.$M(...).text
      - pattern: $C.$M(...).content
    - metavariable-regex:
        metavariable: $C
        regex: ^(?:.*\.)?\w*(?i:client|session|sess|http)\w*$
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:get|post|put|patch|delete|head|request)$
  - patterns:
    - pattern-either:
      - pattern: $R.json()
      - pattern: $R.text
      - pattern: $R.content
    - pattern-inside: |
        $R = $MOD.$M(...)
        ...
    - metavariable-regex:
        metavariable: $MOD
        regex: ^(?:requests|httpx)$
  - patterns:
    - pattern-either:
      - pattern: $R.json()
      - pattern: $R.text
      - pattern: $R.content
    - pattern-either:
      - pattern-inside: |
          $R = await $C.$M(...)
          ...
      - pattern-inside: |
          $R = $C.$M(...)
          ...
    - metavariable-regex:
        metavariable: $C
        regex: ^(?:.*\.)?\w*(?i:client|session|sess|http)\w*$
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:get|post|put|patch|delete|head|request)$
  - patterns:
    - pattern: $F(...)
    - pattern-either:
      - pattern-inside: |
          def $F(...):
            <... $X.$M(...) ...>
            ...
            return <... $R.$P ...>
          ...
      - pattern-inside: |
