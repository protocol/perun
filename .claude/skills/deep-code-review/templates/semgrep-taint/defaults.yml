# Bundled insecure-default (fail-open config) rules. Already covered elsewhere, so not repeated here: secret-env-fallback and tls-verify-off (py.yml, js.yml), cors-credentials-any-origin (js.yml).
# Added: py debug-enabled, py cors-credentials-wildcard, py/js jwt-unverified, py/js auth-fails-open. Test paths are skipped.
# ponytail: auth-fails-open only sees a try/except (catch) inside a function whose name says auth, token, permission, allowed or verify, and only a literal return True / next().
rules:
- id: perun.py.debug-enabled
  languages: [python]
  severity: WARNING
  message: Debug mode is switched on in code (DEBUG = True or app.run(debug=True)). It exposes stack traces and an interactive console in production. Read it from the environment and default it to off.
  pattern-either:
  - pattern: DEBUG = True
  - pattern: $APP.run(..., debug=True, ...)
  - pattern: $APP.debug = True
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.cors-credentials-wildcard
  languages: [python]
  severity: WARNING
  message: CORS allows every origin and also allows credentials. Any site can then make authenticated requests as the user. List the trusted origins explicitly.
  pattern-either:
  - pattern: $A.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
  - pattern: $A.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
  - pattern: CORS($A, ..., origins="*", ..., supports_credentials=True, ...)
  - pattern: CORS($A, ..., supports_credentials=True, ..., origins="*", ...)
  - patterns:
    - pattern: CORS_ALLOW_ALL_ORIGINS = True
    - pattern-either:
      - pattern-inside: |
          CORS_ALLOW_CREDENTIALS = True
          ...
      - pattern-inside: |
          ...
          CORS_ALLOW_CREDENTIALS = True
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.jwt-unverified
  languages: [python]
  severity: ERROR
  message: JWT signature checking is off or the none algorithm is allowed, so anyone can forge a token. Verify with a fixed algorithm list and the real key. Known limit - an options dict whose verification is turned back on before use is still reported.
  pattern-either:
  - pattern: '$J.decode(..., options={..., "verify_signature": False, ...}, ...)'
  - pattern: $J.decode(..., verify=False, ...)
  - pattern: '$J.decode_complete(..., options={..., "verify_signature": False, ...}, ...)'
  - pattern: $J.decode(..., options=dict(..., verify_signature=False, ...), ...)
  - pattern: $J.decode_complete(..., options=dict(..., verify_signature=False, ...), ...)
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $O = {..., "verify_signature": False, ...}
          ...
      - pattern-inside: |
          $O = dict(..., verify_signature=False, ...)
          ...
    - pattern-either:
      - pattern: $J.decode(..., options=$O, ...)
      - pattern: $J.decode_complete(..., options=$O, ...)
  - pattern: $J.decode(..., algorithms=[..., "none", ...], ...)
  - pattern: $J.encode(..., algorithm="none", ...)
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.js.jwt-unverified
  languages: [javascript, typescript]
  severity: ERROR
  message: The JWT none algorithm is allowed, so anyone can forge a token. Verify with a fixed algorithm list and the real key.
  pattern-either:
  - pattern: '$F(..., {..., algorithms: [..., "none", ...], ...})'
  - pattern: '$F(..., {..., algorithm: "none", ...})'
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.jwt-decode-unverified
  languages: [javascript, typescript]
  severity: WARNING
  message: jwt.decode reads the claims without checking the signature, so a forged token is accepted when the result drives an auth decision. Use jwt.verify with the real key and a fixed algorithm list. Accepted noise - a decode before verify in the same function (a kid lookup) is also reported, because a verify call elsewhere in the function proves nothing about this token. Taint rule - any value derived from jwt, jsonwebtoken, require("jsonwebtoken") or an import of it (aliases, .default, jwt['decode'](t)) is followed, and a decode destructured from it is reported at the destructuring line. Known limits - a decode stored in a variable first (const d = jwt.decode; d(t)) is not matched, a module variable reassigned in another function is not killed, and a variable merely named jwt is treated as the module.
  mode: taint
  pattern-sources:
  - pattern: jwt
  - pattern: jsonwebtoken
  - pattern: $X.jwt
  - pattern: require("jsonwebtoken")
  - patterns:
    - pattern: import * as $J from "jsonwebtoken"
    - focus-metavariable: $J
  - patterns:
    - pattern-inside: |
        import $J from "jsonwebtoken"
        ...
    - pattern: $J
  - patterns:
    - pattern-inside: |
        import {..., decode, ...} from "jsonwebtoken"
        ...
    - pattern: decode
  - patterns:
    - pattern-inside: |
        import {..., decode as $D, ...} from "jsonwebtoken"
        ...
    - pattern: $D
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $T.decode(...)
      - pattern: $T["decode"](...)
      - pattern: $T.decode.$M(...)
    - focus-metavariable: $T
  - patterns:
    - pattern-either:
      - pattern: const {..., decode, ...} = $T
      - pattern: 'const {..., decode: $D, ...} = $T'
    - pattern-not: const {...} = require("jsonwebtoken")
    - focus-metavariable: $T
  - patterns:
    - pattern-inside: |
        import {..., decode, ...} from "jsonwebtoken"
        ...
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^decode$
    - focus-metavariable: $F
  - patterns:
    - pattern-inside: |
        import {..., decode as $D, ...} from "jsonwebtoken"
        ...
    - pattern: $D(...)
    - focus-metavariable: $D
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.cors-reflected-origin
  languages: [javascript, typescript]
  severity: WARNING
  message: The handler copies the request Origin header into Access-Control-Allow-Origin and also sends Access-Control-Allow-Credentials true, so any site can read credentialed responses. Reflect the origin only after checking it against a fixed allowlist. Taint rule - an Origin read (any case, any default or fallback, through aliases, locals and string methods) that reaches the header value is reported; a lookup in a module-level literal dict (ALLOWED[origin], ALLOWED.get(origin) where ALLOWED is a dict literal of strings) is treated as the allowlist, and any other lookup (a list index, a cache) is not. Known limits - credentials and reflection split across functions are not matched, an Origin read inside a helper function is not followed (cross-function taint needs Semgrep Pro), and a membership guard (if origin in ALLOWED) does not silence the finding.
  mode: taint
  pattern-sources:
  - pattern: $R.headers.origin
  - patterns:
    - pattern: $H[$K]
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']origin["']$
  - patterns:
    - pattern: $R.$M($K)
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:get|header)$
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']origin["']$
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: $MAP[$X]
      - pattern: $MAP.get($X)
    - pattern-not: $MAP["..."]
    - pattern-not: $MAP.get("...")
    - pattern-inside: |
        var $MAP = {"$K": "...", ...};
        ...
  pattern-sinks:
  - patterns:
    - pattern-inside:
        pattern-either:
        - pattern: |
            function $F(...) {
              ...
              $C.$M2($K2, $V2);
              ...
            }
        - pattern: |
            (...) => {
              ...
              $C.$M2($K2, $V2);
              ...
            }
    - pattern: $R.$M($K, $O)
    - metavariable-regex:
        metavariable: $M
        regex: ^(?:setHeader|header|set|append)$
    - metavariable-regex:
        metavariable: $M2
        regex: ^(?:setHeader|header|set|append)$
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']access-control-allow-origin["']$
    - metavariable-regex:
        metavariable: $K2
        regex: (?i)^["']access-control-allow-credentials["']$
    - metavariable-pattern:
        metavariable: $V2
        pattern-either:
        - pattern: '"true"'
        - pattern: "true"
    - focus-metavariable: $O
  - patterns:
    - pattern-inside:
        pattern-either:
        - pattern: |
            function $F(...) {
              ...
              $C.$M2($K2, $V2);
              ...
            }
        - pattern: |
            (...) => {
              ...
              $C.$M2($K2, $V2);
              ...
            }
    - pattern: $H[$K] = $O
    - metavariable-regex:
        metavariable: $M2
        regex: ^(?:setHeader|header|set|append)$
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']access-control-allow-origin["']$
    - metavariable-regex:
        metavariable: $K2
        regex: (?i)^["']access-control-allow-credentials["']$
    - metavariable-pattern:
        metavariable: $V2
        pattern-either:
        - pattern: '"true"'
        - pattern: "true"
    - focus-metavariable: $O
  - patterns:
    - pattern-either:
      - pattern: '$R.set({..., "$K": $O, ..., "$K2": $V2, ...})'
      - pattern: '$R.set({..., "$K2": $V2, ..., "$K": $O, ...})'
      - pattern: '$R.writeHead($S, {..., "$K": $O, ..., "$K2": $V2, ...})'
      - pattern: '$R.writeHead($S, {..., "$K2": $V2, ..., "$K": $O, ...})'
      - pattern: 'Object.assign($R, {..., "$K": $O, ..., "$K2": $V2, ...})'
      - pattern: 'Object.assign($R, {..., "$K2": $V2, ..., "$K": $O, ...})'
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^access-control-allow-origin$
    - metavariable-regex:
        metavariable: $K2
        regex: (?i)^access-control-allow-credentials$
    - metavariable-regex:
        metavariable: $V2
        regex: (?i)^(?:["']true["']|true)$
    - focus-metavariable: $O
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.py.cors-reflected-origin
  languages: [python]
  severity: WARNING
  message: The handler copies the request Origin header into Access-Control-Allow-Origin and also sends Access-Control-Allow-Credentials true, so any site can read credentialed responses. Reflect the origin only after checking it against a fixed allowlist. Taint rule - an Origin read (any case, any default or fallback, through aliases, locals and string methods) that reaches the header value is reported; a lookup in a module-level literal dict (ALLOWED[origin], ALLOWED.get(origin) where ALLOWED is a dict literal of strings) is treated as the allowlist, and any other lookup (a list index, a cache) is not. Known limits - credentials and reflection split across functions are not matched, an Origin read inside a helper function is not followed (cross-function taint needs Semgrep Pro), and a membership guard (if origin in ALLOWED) does not silence the finding.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $H.get($K, ...)
      - pattern: $H[$K]
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["'](?:http_)?origin["']$
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: $MAP[$X]
      - pattern: $MAP.get($X)
    - pattern-not: $MAP["..."]
    - pattern-not: $MAP.get("...")
    - pattern-inside: |
        $MAP = {"...": "...", ...}
        ...
  pattern-sinks:
  - patterns:
    - pattern-inside:
        pattern-either:
        - pattern: |
            def $F(...):
              ...
              $C[$K2] = $V2
              ...
        - pattern: |
            def $F(...):
              ...
              $C.$M2($K2, $V2)
              ...
    - pattern-either:
      - pattern: $H[$K] = $O
      - pattern: $H.$M($K, $O)
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']access-control-allow-origin["']$
    - metavariable-regex:
        metavariable: $K2
        regex: (?i)^["']access-control-allow-credentials["']$
    - metavariable-pattern:
        metavariable: $V2
        pattern-either:
        - pattern: '"true"'
        - pattern: "True"
    - focus-metavariable: $O
  - patterns:
    - pattern-either:
      - pattern: '$H.update({..., $K: $O, ..., $K2: $V2, ...})'
      - pattern: '$H.update({..., $K2: $V2, ..., $K: $O, ...})'
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["']access-control-allow-origin["']$
    - metavariable-regex:
        metavariable: $K2
        regex: (?i)^["']access-control-allow-credentials["']$
    - metavariable-regex:
        metavariable: $V2
        regex: (?i)^(?:["']true["']|true)$
    - focus-metavariable: $O
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.py.auth-fails-open
  languages: [python]
  severity: WARNING
  message: An auth check returns True from its exception handler, so any error (a bad token, a down key service) grants access. Deny on error.
  patterns:
  - pattern-inside: |
      def $F(...):
        ...
  - metavariable-regex:
      metavariable: $F
      regex: (?i).*(?:auth|token|permission|allowed|verify).*
  - pattern: |
      try:
        ...
      except $E:
        ...
        return True
  paths:
    exclude: ["test", "tests", "fixtures", "mocks", "e2e", "test_*", "*_test.py", "conftest.py"]
- id: perun.js.auth-fails-open
  languages: [javascript, typescript]
  severity: WARNING
  message: An auth check lets the request through from its catch block (it returns true or calls next()), so any error grants access. Deny on error.
  patterns:
  - pattern-either:
    - pattern-inside: |
        function $F(...) {
          ...
        }
    - pattern-inside: |
        const $F = (...) => {
          ...
        }
  - metavariable-regex:
      metavariable: $F
      regex: (?i).*(?:auth|token|permission|allowed|verify).*
  - pattern-either:
    - pattern: |
        try { ... } catch ($E) { ... return true; }
    - pattern: |
        try { ... } catch ($E) { ... return next(); }
    - pattern: |
        try { ... } catch ($E) { ... next(); }
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
