# Bundled generic taint rules (JavaScript/TypeScript). Sources: req/request query, body, params, cookies, headers.
# Sinks: classic injection calls on well-known receivers. A guard `if (!ALLOW.has(x)) return|throw` before the sink suppresses it for x.
# Also hardcoded-credential-compare (a pass/secret/token/api-key name vs a non-empty string literal, WARNING) and hardcoded-basic-auth (a base64-decoded value vs a literal, ERROR); env reads, `typeof` checks, JWT header fields (alg, typ, kid), scheme/sentinel literals (bearer, none, true, ...), single-character literals and test/fixture paths are skipped. ponytail: template literals are not matched.
# Also date-parse-rollover (INFO: a date accepted only because Number.isFinite/isNaN of an inline Date.parse(x) or new Date(x) passed, with no .toISOString() round trip in the enclosing function; V8 reads 2026-02-30 as 2 March; test paths are skipped) and gcm-no-auth-tag-length (WARNING: createDecipheriv with an *-gcm cipher and no authTagLength option, so a truncated tag is accepted, a forgery risk only when the tag length is attacker-controlled). ponytail: any .toISOString() in the enclosing function counts as the round trip, component compares such as getUTCDate are not recognised, a numeric-timestamp new Date(ts) check can report, and a check on a variable bound first (const d = new Date(x); isNaN(d)) is not flagged because those hits were mostly noise; a cipher name that is not a string literal (or a const bound to one) and an options argument that is not an object literal are skipped.
# Also body-cap-after-buffer (INFO: await req.formData()/json()/text()/arrayBuffer() on a receiver named like req or request (req, request, c.req, event.request) followed later in the same block by a .size/.length/.byteLength > cap on the result or on a .get(...) entry of it, or preceded only by a content-length > cap check; a comparison with the literal 0 is an emptiness check, not a cap, and a counted getReader() read passes; test, fixture and mock paths are skipped). ponytail: the receiver is matched by name (one ending in req or request), so a request bound to another name (r) or read through a call (req.clone().json()) is missed, only a > comparison with the result on the left is recognised, a result bound by destructuring or read inline (await req.formData()).get(...) is not tied to a later check, a ?. or ! on the result or on its .get(...) entry (body?.length, body!.length, form.get("f")!.size) is not matched, a deeper field path (body.items.length) is not the result, a read and its check in different blocks (the read inside a try, the check after it) are not tied, and a cap that lives in a middleware or framework option is invisible.
# Also limiter-key-forwarded-header (INFO: an x-forwarded-for / x-real-ip read inside a function named like clientKey, limiterKey, rateKey, deriveKey or getIp; test, fixture and mock paths are skipped). ponytail: the function name is a heuristic, so a key built in an anonymous or differently named function (getClientIp, for one) is missed and any function with a matching name is reported.
# Also fetch-no-timeout (INFO: fetch(url) or fetch(url, {...}) with no signal key inside a Next route handler (export async function GET|POST|PUT|PATCH|DELETE), a pages API export default async function handler or an app.get|post|put|patch|delete|all("/path", ..., fn) callback; options with any signal value or a spread are skipped, as are test paths). ponytail: handlers are matched by shape, so a const-arrow export, a handler passed by name and a route path that is not a literal starting with / or * are not seen, and options held in a variable are read as unknown, not as missing a signal.
# Also auth-cookie-flags (WARNING: a cookie whose literal name has session, sess, sessid, sessionid, phpsessid, sid, token, auth, authtoken or jwt as a whole word (the name is split at punctuation and at lower-to-upper camelCase boundaries, and a name holding csrf or xsrf is skipped because double-submit cookies must stay readable by scripts), set positionally or as one options object by <x>.cookie, <x>.setCookie, cookies().set, (await cookies()).set, a variable bound by X = await cookies() or X = cookies() in an enclosing block (const jar = await cookies(); jar.set(...)) or <x>.cookies.set on any receiver not named below, with httpOnly missing or the literal false, or with secure missing or the literal false; any other httpOnly or secure value passes; ctx.cookies.set, context.cookies.set, event.cookies.set, this.cookies.set and a bare cookies.set are reported only for a literal httpOnly false or secure false, because the cookies library behind Koa's ctx.cookies documents httpOnly as true by default and secure as true by default over HTTPS, and SvelteKit documents both as true by default (secure false in development); a receiver ending in req or request is a request-side cookie and is skipped, and a cookie cleared with an empty value, maxAge: 0 or expires: new Date(0) is skipped; test paths are skipped). ponytail: options must be an object literal (options held in a variable are not read and a spread is skipped), the browser cookieStore (a global, not bound from cookies()) is not seen, a bare cookies.set also covers other frameworks whose defaults were not checked, so their missing flags are not reported, and sameSite is not checked.
# Also cors-credentials-any-origin (WARNING: a cors(...) or register(cors, ...) call with credentials true and an origin of true, the regex /.*/ or a callback that always allows ((o, cb) => cb(null, true), cb(null, o) or cb(null, !!o), written as an arrow expression, an arrow block or a function); or a function that copies req.get|header("origin") or headers.get("origin"), directly or through a variable, into Access-Control-Allow-Origin while it also sets Access-Control-Allow-Credentials to "true" or true, unless an if on a .has, .includes or .test call encloses or precedes the set call in the same block (an allowlist check); origin "*" is not reported because the cors packages send a literal * and browsers refuse it on credentialed requests; req.headers.origin is left to the registry cors-misconfiguration rule; test paths are skipped). ponytail: options held in a variable and a credentials header given as an object are not seen, any such if counts as an allowlist check whatever it tests and a lookup written another way (indexOf, some) is not read, and a callback with other statements or a conditional is not matched.
# Also secret-env-fallback (WARNING: process.env.X, process.env["X"] or import.meta.env.X followed by || or ?? and a non-empty string literal, process.env.X or process.env["X"] assigned with ||= or ??= and a string literal, or a const, let or var destructuring default from process.env (const { X = "..." } = process.env, matched also with other keys around it), where X ends in a secret stem (pass, passwd, password, passcode, passphrase, secret, token, credential, credentials, api_key, apikey, a secret, private, signing, encryption, session, jwt, hmac, master, access, auth, client, app, service, service_role or webhook key compound, or _pwd) after an optional prefix that ends in _ or . or sits at a camelCase boundary; a name behind a public bundler prefix is left to public-env-secret, the literal rule is the one hardcoded-credential-compare uses plus a second check that skips a literal that looks like a file path (it starts with /, ./, ../ or ~/, or ends in .json, .pem, .key, .crt, .cer, .der, .p12, .pfx, .jks, .keystore, .yaml or .yml), and test, fixture and mock paths and playwright.config.*, vitest.config.*, jest.config.* and cypress.config.* files are skipped) and public-env-secret (WARNING: any use, a write included, of process.env.X, process.env["X"] or import.meta.env.X, with or without a fallback, where X starts with NEXT_PUBLIC_, VITE_, REACT_APP_, EXPO_PUBLIC_, NUXT_PUBLIC_, GATSBY_, PUBLIC_, STORYBOOK_ or VUE_APP_ and ends in secret, password, passwd, passcode, passphrase, _pwd, service_role, or a secret, private, signing, encryption or service_role key compound with or without the underscore (secret_key, secretkey), because a bundler inlines such variables into any client code that reads them, so the value can reach every visitor's browser; token, api_key, anon_key, publishable_key and site_key names are not reported because many browser keys are public by design; test, fixture and mock paths are skipped). ponytail: a chained fallback (a || b || "x"), a ternary, a non-null ! read, an alias of process.env, a renamed destructuring ({ K: alias = "x" }) and Deno.env.get are not seen, a template literal with a ${} substitution is not matched, and public-env-secret does not see a destructured read. Not followed: optional chaining (process?.env?.X || "x"), a value first copied to a variable (const s = process.env.X; s || "x") and a value-based fallback (a connection string holding a password under a non-secret name).
rules:
- id: perun.js.sqli
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: Untrusted data reaches a SQL string passed to query(). Use bound parameters.
  pattern-sources:
  - pattern-either:
    - pattern: req.query.$P
    - pattern: req.query
    - pattern: req.body.$P
    - pattern: req.body
    - pattern: req.params.$P
    - pattern: req.params
    - pattern: req.cookies.$P
    - pattern: req.cookies
    - pattern: req.headers.$P
    - pattern: req.headers
    - pattern: request.query.$P
    - pattern: request.query
    - pattern: request.body.$P
    - pattern: request.body
    - pattern: request.params.$P
    - pattern: request.params
    - pattern: request.cookies.$P
    - pattern: request.cookies
    - pattern: request.headers.$P
    - pattern: request.headers
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.query($S, ...)
      - pattern: $DB.execute($S, ...)
      - pattern: $DB.raw($S, ...)
    - metavariable-regex:
        metavariable: $DB
        regex: ^(db|pool|client|conn|connection|knex|sequelize|mysql|pg)$
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: Number(...)
- id: perun.js.command-injection
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
