    - pattern: req.cookies
    - pattern: req.headers.$P
    - pattern: req.headers
    - pattern: request.query.$P
    - pattern: request.query
    - pattern: request.body.$P
    - pattern: request.body
    - pattern: request.params.$P
    - pattern: request.params
    - pattern: request.cookies.$P
    - pattern: request.cookies
    - pattern: request.headers.$P
    - pattern: request.headers
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: exec($S, ...)
      - pattern: execSync($S, ...)
      - pattern: child_process.exec($S, ...)
      - pattern: child_process.execSync($S, ...)
    - pattern-not-inside: |
        if (!$A.has($G)) return ...;
        ...
        <... exec(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) return ...;
        ...
        <... execSync(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) return ...;
        ...
        <... child_process.exec(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) return ...;
        ...
        <... child_process.execSync(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) throw ...;
        ...
        <... exec(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) throw ...;
        ...
        <... execSync(<... $G ...>, ...) ...>
    - pattern-not-inside: |
        if (!$A.has($G)) throw ...;
        ...
        <... child_process.exec(<... $G ...>, ...) ...>
    - pattern-not-inside: |
