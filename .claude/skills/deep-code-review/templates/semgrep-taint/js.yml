- id: perun.js.hardcoded-credential-compare
  languages: [javascript, typescript]
  severity: WARNING
  message: A password, secret, token or API key is compared to a non-empty string literal. Compare against a secret read from the environment or a vault, with a constant-time check.
  patterns:
  - pattern-either:
    - pattern: $X === "$L"
    - pattern: $X == "$L"
    - pattern: $X !== "$L"
    - pattern: $X != "$L"
    - pattern: '"$L" === $X'
    - pattern: '"$L" == $X'
    - pattern: '"$L" !== $X'
    - pattern: '"$L" != $X'
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
  - metavariable-regex:
      metavariable: $X
      regex: ^(?:(?:.*[._])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|.*_(?i:pwd)|.*[a-z0-9](?:Pass|Passwd|Pwd|Password|Passcode|Secret|Token|ApiKey|APIKey)|.*(?:\[|\.get\()["'](?:(?:\w*[_-])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|\w+[_-](?i:pwd))["'][\])])(?:\.(?:toLowerCase|toUpperCase|trim|lower|upper|strip|casefold)\(\))*$
  - metavariable-regex:
      metavariable: $X
      regex: ^(?!.*(?:process\.env|import\.meta\.env|Deno\.env)\b)
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.hardcoded-basic-auth
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: A decoded Basic-auth credential is compared to a string literal, so the password is hardcoded. Check it against a hashed secret from the environment or a vault, with a constant-time compare.
  pattern-sources:
  - pattern-either:
    - pattern: Buffer.from(..., "base64")
    - pattern: Buffer.from(..., "base64").toString(...)
    - pattern: atob(...)
    - pattern: window.atob(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $T === "$L"
      - pattern: $T == "$L"
      - pattern: $T !== "$L"
      - pattern: $T != "$L"
      - pattern: '"$L" === $T'
      - pattern: '"$L" == $T'
      - pattern: '"$L" !== $T'
      - pattern: '"$L" != $T'
    - metavariable-regex:
        metavariable: $L
        regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
    - metavariable-regex:
        metavariable: $T
        regex: ^(?!.*[.\["'](?:alg|typ|kid)["']?\]?$)
    - focus-metavariable: $T
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
