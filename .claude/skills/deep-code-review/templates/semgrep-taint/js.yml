    - pattern: $X == "$L"
    - pattern: $X !== "$L"
    - pattern: $X != "$L"
    - pattern: '"$L" === $X'
    - pattern: '"$L" == $X'
    - pattern: '"$L" !== $X'
    - pattern: '"$L" != $X'
  - metavariable-regex:
      metavariable: $L
      regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
  - metavariable-regex:
      metavariable: $X
      regex: ^(?:(?:.*[._])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|.*_(?i:pwd)|.*[a-z0-9](?:Pass|Passwd|Pwd|Password|Passcode|Secret|Token|ApiKey|APIKey)|.*(?:\[|\.get\()["'](?:(?:\w*[_-])?(?i:pass|passwd|password|passcode|secret|token|api_?key)|\w+[_-](?i:pwd))["'][\])])(?:\.(?:toLowerCase|toUpperCase|trim|lower|upper|strip|casefold)\(\))*$
  - metavariable-regex:
      metavariable: $X
      regex: ^(?!typeof\b|.*(?:process\.env|import\.meta\.env|Deno\.env)\b)
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.hardcoded-basic-auth
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: A decoded Basic-auth credential is compared to a string literal, so the password is hardcoded. Check it against a hashed secret from the environment or a vault, with a constant-time compare.
  pattern-sources:
  - pattern-either:
    - pattern: Buffer.from(..., "base64")
    - pattern: Buffer.from(..., "base64").toString(...)
    - pattern: atob(...)
    - pattern: window.atob(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $T === "$L"
      - pattern: $T == "$L"
      - pattern: $T !== "$L"
      - pattern: $T != "$L"
      - pattern: '"$L" === $T'
      - pattern: '"$L" == $T'
      - pattern: '"$L" !== $T'
      - pattern: '"$L" != $T'
    - metavariable-regex:
        metavariable: $L
        regex: ^(?!(?i:bearer|basic|none|null|undefined|true|false)$)(?:[\W_]*[^\W_]){2}
    - metavariable-regex:
        metavariable: $T
        regex: ^(?!typeof\b|.*[.\["'](?:alg|typ|kid)["']?\]?$)
    - focus-metavariable: $T
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.date-parse-rollover
  languages: [javascript, typescript]
  severity: INFO
  message: 'A date is accepted because Date.parse() or new Date() returned a finite number, but V8 rolls an impossible day over instead of rejecting it (2026-02-30 becomes 2 March). Round-trip the value: format the parsed date back and reject the input unless it matches, for example new Date(ms).toISOString().slice(0, 10) === input.'
  patterns:
  - pattern-either:
    - pattern: $CHK(Date.parse($X))
    - pattern: $CHK(new Date($X))
    - pattern: $CHK(new Date($X).getTime())
  - metavariable-regex:
      metavariable: $CHK
      regex: ^(?:Number\.)?(?:isFinite|isNaN)$
  - pattern-not-inside: |
      function $F(...) {
        ...
        <... $D.toISOString() ...>
        ...
      }
  - pattern-not-inside: |
      ($...P) => {
        ...
        <... $D.toISOString() ...>
        ...
      }
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.gcm-no-auth-tag-length
  languages: [javascript, typescript]
  severity: WARNING
  message: 'createDecipheriv() decrypts with an AES-GCM cipher but passes no authTagLength option, so Node accepts an authentication tag shorter than 16 bytes (a 4-byte tag passes). That weakens integrity only when the tag length is attacker-controlled, for example when the tag is whatever follows the ciphertext in the message. Pass { authTagLength: 16 } as the fourth argument.'
  patterns:
  - pattern-either:
    - pattern: $C.createDecipheriv("$ALG", $K, $IV)
    - pattern: createDecipheriv("$ALG", $K, $IV)
    - pattern: $C.createDecipheriv("$ALG", $K, $IV, {...})
    - pattern: createDecipheriv("$ALG", $K, $IV, {...})
  - pattern-not: '$C.createDecipheriv("$ALG", $K, $IV, {authTagLength: $N, ...})'
  - pattern-not: 'createDecipheriv("$ALG", $K, $IV, {authTagLength: $N, ...})'
  - metavariable-regex:
      metavariable: $ALG
      regex: (?i).*-gcm$
- id: perun.js.body-cap-after-buffer
  languages: [javascript, typescript]
  severity: INFO
  message: The request body is read whole (formData, json, text or arrayBuffer) and its size is only checked afterwards, or only a content-length header is compared before reading. The whole body is already in memory when the cap runs, and a declared length does not bound a chunked body. Read the stream with getReader() and stop at a running byte total instead.
  patterns:
  - pattern: await $REQ.$M()
  - metavariable-regex:
      metavariable: $REQ
      regex: (?i).*req(?:uest)?$
  - metavariable-regex:
      metavariable: $M
      regex: ^(?:formData|json|text|arrayBuffer)$
  - metavariable-regex:
      metavariable: $N
      regex: ^(?!0$)
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $V = await $REQ.$M();
            ...
            <... $V.$P > $N ...>
        - pattern-inside: |
            $V = await $REQ.$M();
            ...
            $F = $V.get(...);
            ...
            <... $F.$P > $N ...>
        - pattern-inside: |
            $V = await $REQ.$M();
            ...
            <... $V.get(...).$P > $N ...>
      - metavariable-regex:
          metavariable: $P
          regex: ^(?:size|length|byteLength)$
    - patterns:
      - pattern-either:
        - pattern-inside: |
            <... (<... $H.get("$CL") ...>) > $N ...>;
            ...
            <... await $REQ.$M() ...>
        - pattern-inside: |
            $L = <... $H.get("$CL") ...>;
            ...
            <... (<... $L ...>) > $N ...>;
            ...
            <... await $REQ.$M() ...>
      - metavariable-regex:
          metavariable: $CL
          regex: (?i)^content-length$
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
- id: perun.js.limiter-key-forwarded-header
  languages: [javascript, typescript]
  severity: INFO
  message: A client or rate-limit key is derived from x-forwarded-for or x-real-ip. Check that only entries added by trusted proxies are used (a client controls the leftmost ones), that a missing header does not map every caller to one shared constant key, and that a missing header does not fail open and skip limiting.
  patterns:
  - pattern-either:
    - pattern: $H.get("$HDR")
    - pattern: $H.header("$HDR")
    - pattern: $H["$HDR"]
  - metavariable-regex:
      metavariable: $HDR
      regex: (?i)^(?:x-forwarded-for|x-real-ip)$
  - pattern-either:
    - pattern-inside: |
        function $F(...) {
          ...
        }
    - pattern-inside: |
        $F = function (...) {
          ...
        }
    - pattern-inside: |
        $F = ($...P) => {
          ...
        }
  - metavariable-regex:
      metavariable: $F
      regex: (?i).*(?:(?:client|limiter|rate)key|derivekey|getip)
  paths:
    exclude: ["test", "tests", "__tests__", "spec", "fixtures", "mocks", "__mocks__", "e2e", "*.test.*", "*.spec.*"]
