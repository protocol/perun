# Bundled generic taint rules (JavaScript/TypeScript). Sources: req/request query, body, params, cookies, headers.
# Sinks: classic injection calls on well-known receivers. A guard `if (!ALLOW.has(x)) return|throw` before the sink suppresses it for x.
# Also hardcoded-credential-compare (a pass/secret/token/api-key name vs a non-empty string literal, WARNING) and hardcoded-basic-auth (a base64-decoded value vs a literal, ERROR); env reads, JWT header fields (alg, typ, kid), scheme/sentinel literals (bearer, none, true, ...), single-character literals and test/fixture paths are skipped. ponytail: template literals are not matched.
rules:
- id: perun.js.sqli
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: Untrusted data reaches a SQL string passed to query(). Use bound parameters.
  pattern-sources:
  - pattern-either:
    - pattern: req.query.$P
    - pattern: req.query
    - pattern: req.body.$P
    - pattern: req.body
    - pattern: req.params.$P
    - pattern: req.params
    - pattern: req.cookies.$P
    - pattern: req.cookies
    - pattern: req.headers.$P
    - pattern: req.headers
    - pattern: request.query.$P
    - pattern: request.query
    - pattern: request.body.$P
    - pattern: request.body
    - pattern: request.params.$P
    - pattern: request.params
    - pattern: request.cookies.$P
    - pattern: request.cookies
    - pattern: request.headers.$P
    - pattern: request.headers
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.query($S, ...)
      - pattern: $DB.execute($S, ...)
      - pattern: $DB.raw($S, ...)
    - metavariable-regex:
        metavariable: $DB
        regex: ^(db|pool|client|conn|connection|knex|sequelize|mysql|pg)$
    - focus-metavariable: $S
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: Number(...)
- id: perun.js.command-injection
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: Untrusted data reaches a shell command. Use execFile with an argv array.
  pattern-sources:
