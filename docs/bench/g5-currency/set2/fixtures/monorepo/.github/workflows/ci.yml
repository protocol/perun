name: ci
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.0
      - uses: actions/setup-node@v4.0.0
      - uses: pnpm/action-setup@v3.0.0
      - uses: actions/upload-artifact@v4.3.0
      - uses: docker/build-push-action@v7.4.0
      - run: pnpm -r test
