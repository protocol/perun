name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.6.0
      - uses: actions/cache@v3.3.2
      - uses: actions/setup-node@v3.9.1
      - uses: actions/setup-go@v7.0.0
      - uses: actions/download-artifact@v8.0.2
      - run: npm ci && go test ./...
