[versions]
micrometer = "1.10.5"
moshi = "1.12.0"
csv = "1.9.0"
serialization = "1.12.0"

[libraries]
micrometer = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
csv = { group = "org.apache.commons", name = "commons-csv", version.ref = "csv" }
serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

[bundles]
io = ["moshi", "csv", "serialization"]
