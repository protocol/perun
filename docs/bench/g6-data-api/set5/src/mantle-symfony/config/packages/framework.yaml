framework:
    secret: '%env(APP_SECRET)%'
    http_client:
        default_options:
            timeout: 5
            max_redirects: 0
    rate_limiter:
        api:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        login:
            policy: sliding_window
            limit: 8
            interval: '10 minutes'
