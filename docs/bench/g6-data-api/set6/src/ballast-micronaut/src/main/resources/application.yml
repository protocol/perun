micronaut:
  application:
    name: ballast
  server:
    host: 127.0.0.1
    port: ${PORT:8080}
    ssl:
      enabled: ${BALLAST_TLS:false}
      key-store:
        path: ${BALLAST_KEYSTORE:}
        password: ${BALLAST_KEYSTORE_PASSWORD:}
  security:
    enabled: true
    token:
      enabled: true
