version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  # Deliberately vulnerable corpora (fixtures/bench): never auto-update.
  # ignore + directories also suppress security-update runs; limit 0 blocks PRs.
  - package-ecosystem: npm
    directories:
      - /scripts/fixtures/**/*
      - /bench/**/*
      - /docs/bench/**/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: pip
    directories:
      - /scripts/fixtures/**/*
      - /bench/**/*
      - /docs/bench/**/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
