name: ci-fix
on:
  workflow_run:
    workflows: [build]
    types: [completed]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: suggest fix
        env:
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          codex exec "Fix the build. Commit note: $MSG"
