name: triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Triage issue number ${{ github.event.issue.number }} with gh issue view"
          claude_args: --allowedTools "Bash(gh issue view:*),Read"
